<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陶藝知識庫 - 陶藝與釉藥調配</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入知識庫大腦 (分類資料) -->
    <script src="./assets/js/knowledge-data.js"></script>

    <style>
        :root {
            --primary-bg: #14213d;
            --accent-color: #fca311;
            --sidebar-bg: #f8f9fa;
            --border-color: #e2e8f0;
            --text-main: #2d3748;
            --text-muted: #718096;
            --active-bg: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* === 左側動態目錄側邊欄 === */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            z-index: 10;
        }

        #sidebar.collapsed { margin-left: -320px; }

        .sidebar-header {
            padding: 18px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 { font-size: 1.1rem; color: var(--primary-bg); display: flex; align-items: center; gap: 10px; }
        
        .close-sidebar-mobile {
            background: none; border: none; font-size: 1.3rem; color: var(--primary-bg);
            cursor: pointer; display: none; border-radius: 4px; padding: 4px;
        }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px 10px; }

        /* 手風琴目錄樣式 */
        .category-group { margin-bottom: 8px; }
        .category-title {
            font-weight: bold; font-size: 0.95rem; padding: 12px; border-radius: 6px;
            color: var(--primary-bg); background-color: transparent; display: flex; 
            align-items: center; gap: 10px; cursor: pointer; transition: background 0.2s;
            border: 1px solid transparent;
        }
        .category-title:hover { background-color: var(--active-bg); }
        .category-title i.toggle-icon { margin-left: auto; font-size: 0.8rem; transition: transform 0.3s; }
        .category-group.open .category-title { background-color: #edf2f7; border-color: #cbd5e1; }
        .category-group.open .category-title i.toggle-icon { transform: rotate(180deg); }

        .article-list { list-style: none; padding-left: 28px; display: none; margin-top: 5px; flex-direction: column; gap: 2px; }
        .category-group.open .article-list { display: flex; }

        .article-item {
            display: block; padding: 8px 10px; font-size: 0.9rem; color: var(--text-muted);
            text-decoration: none; border-radius: 4px; transition: all 0.2s; cursor: pointer;
        }
        .article-item:hover { color: var(--primary-bg); background-color: #f1f5f9; padding-left: 14px; }
        .article-item.active { color: var(--primary-bg); background-color: var(--active-bg); font-weight: bold; border-left: 4px solid var(--accent-color); padding-left: 10px;}

        /* === 右側主閱讀區 === */
        #main-content {
            flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-color: #ffffff;
        }

        .top-toolbar {
            height: 52px; border-bottom: 1px solid var(--border-color); display: flex;
            align-items: center; padding: 0 20px; background-color: #ffffff; flex-shrink: 0;
        }

        .toggle-btn {
            background: #edf2f7; border: none; color: var(--primary-bg); padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .toggle-btn:hover { background: var(--primary-bg); color: #ffffff; }
        .current-path { margin-left: 15px; font-size: 0.9rem; color: var(--text-muted); font-weight: bold; }

        /* iframe 容器 */
        .reader-body { flex: 1; width: 100%; border: none; background-color: #fff; }

        /* 手機版 RWD */
        @media (max-width: 1000px) {
            #sidebar { position: absolute; height: 100%; width: 85vw; max-width: 350px; box-shadow: 4px 0 25px rgba(0,0,0,0.2); }
            #sidebar.collapsed { margin-left: -100%; }
            .close-sidebar-mobile { display: block; }
            .current-path { display: none; }
        }
    </style>
</head>
<body>

    <!-- 左側動態目錄側邊欄 -->
    <aside id="sidebar" class="collapsed">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-book-journal-whills" style="color: var(--accent-color);"></i> 陶藝知識庫</h3>
            <button class="close-sidebar-mobile" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- 這裡的選單會由 JavaScript 自動生成 -->
        </div>
    </aside>

    <!-- 右側主要閱讀區 -->
    <main id="main-content">
        <div class="top-toolbar">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars-staggered"></i> <span id="toggleText">開啟目錄</span>
            </button>
            <div class="current-path" id="current-path">請從左側選擇文章</div>
        </div>

        <!-- 嵌入文章的 iframe -->
        <iframe id="articleFrame" class="reader-body" src=""></iframe>
    </main>

    <script>
        // --- 1. 動態生成側邊欄目錄 ---
        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';

            knowledgeTree.forEach((group, index) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';
                // 預設展開第一個分類
                if (index === 0) groupDiv.classList.add('open'); 

                // 建立分類標題
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `<i class="fa-solid ${group.icon}"></i> ${group.category} <i class="fa-solid fa-chevron-down toggle-icon"></i>`;
                titleDiv.onclick = () => groupDiv.classList.toggle('open');

                // 建立文章清單
                const listUl = document.createElement('ul');
                listUl.className = 'article-list';
                
                group.articles.forEach(article => {
                    const itemLi = document.createElement('li');
                    itemLi.className = 'article-item';
                    itemLi.dataset.id = article.id;
                    itemLi.textContent = article.title;
                    
                    itemLi.onclick = (e) => {
                        e.stopPropagation();
                        loadArticle(article.url, article.id, group.category, article.title);
                        if(window.innerWidth <= 1000) toggleSidebar(); // 手機版點擊後自動收起側欄
                    };
                    listUl.appendChild(itemLi);
                });

                groupDiv.appendChild(titleDiv);
                groupDiv.appendChild(listUl);
                container.appendChild(groupDiv);
            });
        }

        // --- 2. 載入文章與更新介面狀態 ---
        function loadArticle(url, id, category, title) {
            // 切換 iframe 內容
            document.getElementById('articleFrame').src = url;
            
            // 更新上方麵包屑路徑
            document.getElementById('current-path').innerHTML = `<span style="color: var(--accent-color);">${category}</span> <i class="fa-solid fa-angle-right" style="margin: 0 8px; font-size: 0.8em;"></i> ${title}`;

            // 更新左側選單的 Active 狀態 (粗體與左側飾條)
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.article-item[data-id="${id}"]`);
            if(activeItem) activeItem.classList.add('active');
        }

        // --- 3. 處理網址參數 (深度連結 Deep Linking) ---
        function handleUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('article');

            if (targetId) {
                // 如果有帶參數，尋找對應文章並載入
                const articleData = findArticleById(targetId);
                if (articleData) {
                    loadArticle(articleData.url, articleData.id, articleData.category, articleData.title);
                    
                    // 自動展開該分類
                    document.querySelectorAll('.category-group').forEach(group => {
                        const hasItem = group.querySelector(`[data-id="${targetId}"]`);
                        if(hasItem) group.classList.add('open');
                        else group.classList.remove('open');
                    });
                    return;
                }
            }
            // 如果沒帶參數或找不到，預設載入第一篇文章
            const firstArticle = knowledgeTree[0].articles[0];
            loadArticle(firstArticle.url, firstArticle.id, knowledgeTree[0].category, firstArticle.title);
        }

        // --- 4. 側邊欄開關控制 ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            sidebar.classList.toggle('collapsed');
            toggleText.textContent = sidebar.classList.contains('collapsed') ? '開啟目錄' : '關閉目錄';
        }

        // --- 啟動初始化 ---
        window.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            handleUrlParams();
            // 電腦版預設打開側欄
            if(window.innerWidth > 1000) {
                document.getElementById('sidebar').classList.remove('collapsed');
                document.getElementById('toggleText').textContent = '關閉目錄';
            }
        });
    </script>
</body>
</html>
